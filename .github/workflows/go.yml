# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  # Daily run against the `edge` image to catch breaking changes in upcoming
  # FalkorDB releases before they reach a stable release.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      falkordb_image_tag:
        description: "FalkorDB Docker image tag to test against (defaults to latest)"
        required: false
        default: "latest"


jobs:

  # Single source of truth for the FalkorDB image tag. It cannot be a plain
  # `env:` variable because GitHub does not allow the `env` context in
  # `jobs.<id>.services.<id>.image`, so it is resolved once here and consumed
  # via `needs.falkordb-version.outputs.version`.
  falkordb-version:
    name: Resolve FalkorDB version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          # Released `latest` for pull requests, pushes and tags; `edge` for the
          # scheduled daily run; an explicit tag on manual dispatch.
          FALKORDB_VERSION: ${{ github.event.inputs.falkordb_image_tag || (github.event_name == 'schedule' && 'edge' || 'latest') }}
        run: |
          echo "Testing against falkordb/falkordb:$FALKORDB_VERSION"
          echo "version=$FALKORDB_VERSION" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: falkordb-version

    # Without this the job inherits the 6 hour default, so a hung suite holds a
    # runner all morning and then reports `cancelled` rather than failing.
    timeout-minutes: 30

    services:
      falkordb:
        # Tag resolved by the `falkordb-version` job above.
        image: falkordb/falkordb:${{ needs.falkordb-version.outputs.version }}
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      # -count=1 disables the test cache. The results only depend on the source,
      # as far as `go test` can tell, so a run against `edge` happily replays a
      # pass recorded against `latest` and reports `(cached)` without contacting
      # the server at all. That makes the daily `edge` run report nothing.
      run: go test -count=1 -v ./...

  # A cron job has nobody watching it: GitHub only emails whoever last touched
  # the cron line, so a failing daily run would otherwise go unnoticed. The
  # reporter is shared with the other FalkorDB clients, which all need the same
  # alert; `permissions` has to stay here because a called workflow can only
  # downgrade the caller's token.
  report-scheduled-failure:
    name: Report scheduled failure
    needs: [falkordb-version, build]
    # `cancelled` as well as `failure`: a job stopped by its own timeout, or one
    # that ran into GitHub's six hour ceiling, reports `cancelled`, and a nightly
    # that hangs is exactly the case this alert exists for.
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      issues: write
    # Pinned, and only the one secret it declares is passed: a mutable ref
    # plus `secrets: inherit` would let a later upstream change run with this
    # repo's secrets. Dependabot keeps the pin current.
    uses: FalkorDB/.github/.github/workflows/report-scheduled-failure.yml@126ec30105d98bdfb62b5631e92aa149fc0e5ad1 # 2026-08-13
    secrets:
      DRIVERS_GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DRIVERS_GOOGLE_CHAT_WEBHOOK_URL }}
